[project]
name = "recog"
version = "0.1.0"
description = "e2e solution for custom face recognition+inference on an rtsp stream"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hdbscan>=0.8.43",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.26.0",
    "pandas>=3.0.3",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
    "psycopg2>=2.9.12",
    "scikit-learn>=1.8.0",
]
